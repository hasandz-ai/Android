<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Obsidian Slate to Midnight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>

    <!-- Core Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#fb923c" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Accent Gold Glow -->
    <linearGradient id="glowRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="materialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fb8b24" flood-opacity="0.25"/>
    </filter>

    <!-- Inner Ambient Lighting -->
    <radialGradient id="ambientLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb8b24" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Material Squircle Surface (Maskable & Standard Compatible) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="118" fill="url(#ambientLight)"/>

  <!-- Subtle Concentric Track / Progress Ring Background -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="18"/>
  
  <!-- Dynamic Progress Track Ring in Amber Gradient -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="url(#glowRingGrad)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="1093" stroke-dashoffset="260"
          transform="rotate(-90 256 256)" filter="url(#materialShadow)"/>

  <!-- Inner Dynamic Activity Flame & Habit Checkmark Motif -->
  <g filter="url(#materialShadow)">
    <!-- Stylized Habit Dynamic Flame/Shield -->
    <path d="M 256 112 
             C 272 168 328 200 328 268 
             C 328 316 294 356 256 372 
             C 218 356 184 316 184 268 
             C 184 220 220 180 236 152 
             C 240 180 254 196 268 208 
             C 278 174 270 144 256 112 Z" 
          fill="url(#amberGrad)"/>

    <!-- Inner Core Crisp Checkmark Accent -->
    <path d="M 224 268 L 248 292 L 292 242" 
          fill="none" 
          stroke="#000000" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Glowing Accent Sparkle -->
  <circle cx="340" cy="144" r="8" fill="#fde047" opacity="0.9"/>
  <circle cx="168" cy="344" r="5" fill="#f59e0b" opacity="0.75"/>
</svg>
